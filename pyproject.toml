[project]
name = "browzer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12",
    "mcp>=1.0",
    "httpx>=0.27",
    "openai>=1.0",
]

[project.scripts]
browzer = "browzer.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/browzer"]
